<main class="mx-auto flex h-full w-full max-w-md items-center px-6 py-10">
  <section
    class="w-full rounded-2xl border border-neutral-200/60 bg-white/80 p-8 shadow-xl shadow-neutral-900/5 backdrop-blur-sm dark:border-neutral-800 dark:bg-neutral-900/80 dark:shadow-black/20"
  >
    <div class="flex flex-col items-center gap-3 text-center">
      <img src="/logo.png" alt="Quick Notes" class="h-16 w-16 rounded-2xl shadow-md" />
      <div>
        <h1 class="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">Welcome back</h1>
        <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">Sign in to access your notes.</p>
      </div>
    </div>

    <form class="mt-8 flex flex-col gap-4" (ngSubmit)="submit()">
      <label class="flex flex-col gap-1 text-sm text-neutral-700 dark:text-neutral-200">
        Email
        <div class="relative">
          <lucide-icon
            [img]="mailIcon"
            class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400"
          ></lucide-icon>
          <input
            type="email"
            required
            class="w-full rounded-xl border border-neutral-300 bg-white py-2.5 pl-10 pr-3 text-base text-neutral-900 outline-none transition-colors focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 dark:focus:ring-neutral-100/10"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
          />
        </div>
      </label>

      <label class="flex flex-col gap-1 text-sm text-neutral-700 dark:text-neutral-200">
        Password
        <div class="relative">
          <lucide-icon
            [img]="lockIcon"
            class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400"
          ></lucide-icon>
          <input
            type="password"
            required
            class="w-full rounded-xl border border-neutral-300 bg-white py-2.5 pl-10 pr-3 text-base text-neutral-900 outline-none transition-colors focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10 dark:border-neutral-700 dark:bg-neutral-950 dark:text-neutral-100 dark:focus:border-neutral-100 dark:focus:ring-neutral-100/10"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
          />
        </div>
      </label>

      @if (errorMessage()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        class="mt-2 inline-flex items-center justify-center gap-2 rounded-xl bg-neutral-900 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-300"
      >
        <lucide-icon [img]="loginIcon" class="h-4 w-4"></lucide-icon>
        Sign in
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-500 dark:text-neutral-400">
      Don't have an account?
      <a routerLink="/register" class="font-medium text-neutral-900 underline underline-offset-2 dark:text-neutral-100">Create one</a>
    </p>
  </section>
</main>
