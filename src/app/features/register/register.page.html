<main class="mx-auto flex h-full w-full max-w-md items-center px-6 py-10">
  <section class="w-full rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm dark:border-neutral-700 dark:bg-neutral-900">
    <h1 class="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">Create account</h1>
    <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">Synced to your account across devices.</p>

    <form class="mt-6 flex flex-col gap-4" (ngSubmit)="submit()">
      <label class="flex flex-col gap-1 text-sm text-neutral-700 dark:text-neutral-200">
        Email
        <input
          type="email"
          required
          class="rounded-lg border border-neutral-300 bg-white px-3 py-2 text-base text-neutral-900 outline-none focus:border-neutral-500 dark:border-neutral-600 dark:bg-neutral-950 dark:text-neutral-100"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
        />
      </label>

      <label class="flex flex-col gap-1 text-sm text-neutral-700 dark:text-neutral-200">
        Password
        <input
          type="password"
          required
          minlength="6"
          class="rounded-lg border border-neutral-300 bg-white px-3 py-2 text-base text-neutral-900 outline-none focus:border-neutral-500 dark:border-neutral-600 dark:bg-neutral-950 dark:text-neutral-100"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
      </label>

      @if (errorMessage()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        class="mt-2 inline-flex items-center justify-center gap-2 rounded-lg bg-neutral-900 px-4 py-2 text-sm font-medium text-white hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-300"
      >
        <lucide-icon [img]="registerIcon" class="h-4 w-4"></lucide-icon>
        Create account
      </button>
    </form>

    <p class="mt-4 text-sm text-neutral-500 dark:text-neutral-400">
      Already have an account?
      <a routerLink="/login" class="text-neutral-900 underline dark:text-neutral-100">Sign in</a>
    </p>
  </section>
</main>
