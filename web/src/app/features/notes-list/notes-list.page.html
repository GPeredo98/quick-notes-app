<div class="mx-auto flex h-full max-w-5xl flex-col px-6 py-8">
  <header class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">Quick Notes</h1>
      <p class="text-sm text-neutral-500 dark:text-neutral-400">{{ currentUser() }}</p>
    </div>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg border border-neutral-300 px-4 py-2 text-sm font-medium text-neutral-700 hover:bg-neutral-100 dark:border-neutral-700 dark:text-neutral-100 dark:hover:bg-neutral-800"
        (click)="openSettings()"
      >
        <lucide-icon [img]="settingsIcon" class="h-4 w-4"></lucide-icon>
      </button>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg bg-neutral-900 px-4 py-2 text-sm font-medium text-white hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-300"
        (click)="createNote()"
      >
        <lucide-icon [img]="newNoteIcon" class="h-4 w-4"></lucide-icon>
        New
      </button>
    </div>
  </header>

  @if (notes().length === 0) {
    <div class="flex flex-1 flex-col items-center justify-center gap-2 text-neutral-500 dark:text-neutral-400">
      <p class="text-lg">No notes yet</p>
      <p class="text-sm">Create your first note to get started</p>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (note of notes(); track note.id) {
        <qn-note-card
          [note]="note"
          (open)="openNote($event)"
          (togglePinned)="togglePinned($event)"
          (deleteNote)="deleteNote($event)"
        />
      }
    </div>
  }
</div>
