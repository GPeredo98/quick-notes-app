<div class="flex h-full flex-col">
  <header class="flex flex-col border-b border-neutral-200 bg-white dark:border-neutral-700 dark:bg-neutral-900">
    <div class="flex items-center gap-3 px-4 pt-3">
      <a
        routerLink="/"
        class="flex shrink-0 items-center gap-1 rounded-lg px-2 py-1.5 text-sm text-neutral-600 hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-800"
        title="Back to notes"
      >
        <lucide-icon [img]="backIcon" class="h-4 w-4"></lucide-icon>
        Notes
      </a>

      <qn-recent-tabs
        [notes]="recentNotes()"
        [activeId]="id()"
        (select)="openRecentNote($event)"
        (close)="closeRecentTab($event)"
      />

      <div class="flex shrink-0 items-center gap-1">
        @for (swatch of colorSwatches; track swatch.value) {
          <button
            type="button"
            class="h-5 w-5 rounded-full"
            [class]="swatch.swatchClass"
            [class.ring-2]="note()?.color === swatch.value"
            [class.ring-neutral-900]="note()?.color === swatch.value"
            [class.ring-offset-1]="note()?.color === swatch.value"
            [title]="swatch.label"
            (click)="selectColor(swatch.value)"
          ></button>
        }
      </div>

      <button
        type="button"
        class="shrink-0 rounded-lg p-2 leading-none hover:bg-neutral-100 dark:hover:bg-neutral-800"
        [class.text-amber-500]="note()?.pinned"
        title="Pin note"
        (click)="togglePinned()"
      >
        <lucide-icon [img]="pinIcon" class="h-5 w-5"></lucide-icon>
      </button>

      <button
        type="button"
        class="shrink-0 rounded-lg p-2 text-neutral-500 hover:bg-neutral-100 hover:text-red-600 dark:text-neutral-400 dark:hover:bg-neutral-800"
        title="Delete note"
        (click)="deleteNote()"
      >
        <lucide-icon [img]="trashIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>

    <input
      #titleInput
      type="text"
      placeholder="Untitled note"
      class="w-full border-none bg-transparent px-4 py-3 text-2xl font-semibold text-neutral-900 outline-none placeholder:text-neutral-300 dark:text-neutral-100 dark:placeholder:text-neutral-600"
      (input)="onTitleInput($event)"
    />

    @if (note(); as currentNote) {
      <p class="px-4 pb-2 text-xs text-neutral-400 dark:text-neutral-500">
        {{ currentNote.owner }} · created
        {{ currentNote.createdAt | date: 'medium' }}
      </p>
    }

    <qn-formatting-toolbar />
  </header>

  <div
    #editor
    class="flex-1 overflow-y-auto px-6 py-6 text-base leading-relaxed text-neutral-900 outline-none dark:text-neutral-100"
    contenteditable="true"
    (input)="onContentInput($event)"
  ></div>
</div>
